id_seed: "w0-selftest"
difficulty: easy
lessons:
  L07: 00000000-0000-4000-8000-000000000007
  L09: 00000000-0000-4000-8000-000000000009
figures:
  F1: figures/q3.json
questions:
  - n: 1
    lessons: [L07]
    stem: "A cuboid face measures $5\\,\\text{cm}$ by $2\\,\\text{cm}$. Find its area."
    stem_si: "පැතිකඩ මතුපිටක් $5\\,\\text{cm}$ සහ $2\\,\\text{cm}$ වේ. එහි වර්ගඵලය සොයන්න."
    approach: "Area $=$ length $\\times$ width.\n\n- $5 \\times 2$"
    approach_si: "වර්ගඵලය $=$ දිග $\\times$ පළල.\n\n- $5 \\times 2$"
    final: "$10\\,\\text{cm}^2$"
    final_si: "$10\\,\\text{cm}^2$"
  - n: 2
    lessons: [L07, L09]
    stem: "A rectangle is $10$ cm by $4$ cm."
    stem_si: "සෘජුකෝණාස්‍රයක් $10$ cm වැඩි $4$ cm පළල වේ."
    parts:
      - label: a
        text: "Find its perimeter."
        text_si: "එහි පරිමිතිය සොයන්න."
        approach: "$2(10+4)$"
        approach_si: "$2(10+4)$"
        final: "$28\\,\\text{cm}$"
        final_si: "$28\\,\\text{cm}$"
      - label: b
        text: "It is split into two equal squares."
        text_si: "එය සමාන වර්ග දෙකකට බෙදේ."
        parts:
          - label: i
            text: "Find the side of each square."
            text_si: "එක් වර්ගයක පැතිකඩ දිග සොයන්න."
            approach: "$10/2$"
            approach_si: "$10/2$"
            final: "$5\\,\\text{cm}$"
            final_si: "$5\\,\\text{cm}$"
          - label: ii
            text: "Find the perimeter of one square."
            text_si: "එක් වර්ගයක පරිමිතිය සොයන්න."
            approach: "$4 \\times 5$"
            approach_si: "$4 \\times 5$"
            final: "$20\\,\\text{cm}$"
            final_si: "$20\\,\\text{cm}$"
  - n: 3
    lessons: [L09]
    stem: "The rectangle in the figure has sides in the ratio $9:4$."
    stem_si: "රූපයේ සෘජුකෝණාස්‍රයේ පැති අනුපාතය $9:4$ වේ."
    figure: F1
    approach: "Count the units."
    approach_si: "ඒකක ගණන් කරන්න."
    final: "$9:4$"
    final_si: "$9:4$"
