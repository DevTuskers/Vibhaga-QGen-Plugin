needs_review:
- en: three-figure bearing
  grades:
  - 8
  - 9
  why: Explicitly not_taught in G8 L24, G9 L27 (taught in G10 L31 and G11 L18 using දිගංශය) — an author wanting a bearing word at G8-G9 has no corpus source. Rule before use.
- en: quadrant (Cartesian)
  grades:
  - 7
  - 8
  why: G7 L23 teaches only the first quadrant without naming 'quadrant'; the word කාර්තුව exists only for pie-chart sectors in G10/G11.
- en: octagon / heptagon / decagon
  grades:
  - 7
  why: Only pentagon (පංචාස්‍රය) and hexagon (ෂඩස්‍රය) appear in the corpus.
- en: cube root
  grades:
  - 8
  - 10
  why: not_taught in G8 L08 and G10 L02; no Sinhala form shown.
- en: standard form / significant figures
  grades:
  - 9
  why: not_taught in G9 L01 — the lesson stops at scientific notation.
- en: empty set symbol ∅
  grades:
  - 11
  why: not_taught in G11 L24; 'අභිශූන්‍ය කුලකය' (non-empty set) exists in G8 but the empty set itself is never named.
- en: compasses / pair of compasses
  grades:
  - 7
  - 8
  why: Corpus shows කවකටුව only; if a plural/collective English phrasing is needed, cite කවකටුව.
- en: set square
  grades:
  - 7
  - 8
  why: Constructions use කවකටුව + කෝදුව only; the set-square instrument is never named in the corpus.
- en: x-intercept / y-intercept
  grades:
  - 9
  - 10
  why: Graph lessons name the gradient (අනුක්‍රමණය) but never the intercepts.
- en: tree diagram / outcome table
  grades:
  - 8
  - 10
  why: not_taught in both probability lessons; combined outcomes are handled by counting, no diagram name exists.
