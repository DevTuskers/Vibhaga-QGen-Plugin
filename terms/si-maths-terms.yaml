    example: O ස්ථානයේ සිට P ස්ථානය උතුරේ සිට 50° ක් නැගෙනහිර දිශාවෙන් පිහිටා ඇත.
    grades:
    - 8
    pattern: <A> සිට <deg>°ක් <direction> දිශාවෙන් <B> පිහිටා ඇත
    sources:
    - maths/grade-08/lessons/24-Location-of-a-Place.md
  probability event classes:
    grades:
    - 7
    - 8
    note: NO certain/likely/unlikely word scale exists in these lessons — never write නිශ්චිත/බොහෝ දුරට/අසම්භාව්‍ය event classes; use the taught three-class phrasing.
    pattern: 'G7: ස්ථීරවම සිදුවන සිද්ධි · ස්ථීරවම සිදුනොවන සිද්ධි · අහඹු සිදුවීම — events classified into three kinds.

      G8: ස්ථිරවම සිදු වන සිදුවීම · ස්ථිර ම සිදු නොවන සිදුවීම · අහඹු සිදුවීම — same three classes, different spelling of the first two.'
    sources:
    - maths/grade-07/lessons/29-Likelihood-of-an-Event-Occurring.md
    - maths/grade-08/lessons/29-Probability.md
