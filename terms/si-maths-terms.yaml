    en_equivalent: N<deg>E · S<deg>E · S<deg>W · N<deg>W
    grades:
    - 8
    note: 'G8 L24 teaches quadrant bearings ONLY — three-figure bearings (e.g. 050°) are on the card''s not_taught list. Direction letters: උ=N · ද=S · නැ=E · බ=W. There is no single-word ''bearing'' term; do not coin one (e.g. දිශාංකය) — use the format.'
    pattern: උ <deg>° නැ · ද <deg>° නැ · ද <deg>° බ · උ <deg>° බ
    sources:
