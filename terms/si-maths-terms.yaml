phrases:
  clock time:
    grades:
    - 6
    pattern: 'hh : mm : ss · පෙ.ව. (a.m.) · ප.ව. (p.m.)'
    sources:
    - maths/grade-06/lessons/04-Time.md
  location phrasing:
    example: O ස්ථානයේ සිට P ස්ථානය උතුරේ සිට 50° ක් නැගෙනහිර දිශාවෙන් පිහිටා ඇත.
    grades:
    - 8
    pattern: <A> සිට <deg>°ක් <direction> දිශාවෙන් <B> පිහිටා ඇත
    sources:
    - maths/grade-08/lessons/24-Location-of-a-Place.md
  probability event classes:
    grades:
    - 7
    - 8
    note: NO certain/likely/unlikely word scale exists in these lessons — never write නිශ්චිත/බොහෝ දුරට/අසම්භාව්‍ය event classes; use the taught three-class phrasing.
    pattern: 'G7: ස්ථීරවම සිදුවන සිද්ධිය · ස්ථීරවම සිදුනොවන සිද්ධිය · අහඹු සිදුවීම — events classified into three kinds.

      G8: ස්ථිරවම සිදු වන සිදුවීම · ස්ථිර ම සිදු නොවන සිදුවීම · අහඹු සිදුවීම — same three classes, different spelling of the first two.'
    sources:
    - maths/grade-07/lessons/29-Likelihood-of-an-Event-Occurring.md
    - maths/grade-08/lessons/29-Probability.md
  quadrant bearing format:
    en_equivalent: N<deg>E · S<deg>E · S<deg>W · N<deg>W
    grades:
    - 8
    note: 'G8 L24 teaches quadrant bearings ONLY — three-figure bearings (e.g. 050°) are on the card''s not_taught list. Direction letters: උ=N · ද=S · නැ=E · බ=W. There is no single-word ''bearing'' term; do not coin one (e.g. දිශාංකය) — use the format.'
    pattern: උ <deg>° නැ · ද <deg>° නැ · ද <deg>° බ · උ <deg>° බ
    sources:
    - maths/grade-08/lessons/24-Location-of-a-Place.md
  set notation phrasing:
    grades:
    - 8
    pattern: '''x අවයවයක් වේ'' = x ∈ A · ''x අවයවයක් නොවේ'' = x ∉ A'
    sources:
    - maths/grade-08/lessons/19-Sets.md
  units in Sinhala text:
    grades:
    - 6
    - 7
    - 8
    - 9
    - 10
    - 11
    note: 'Owner ruling: units stay in English after numbers in Sinhala.'
    pattern: 'English unit symbols after numbers in Sinhala text: $4$ cm, 100 cm = 1 m, kg, g, mm'
    sources:
    - maths/grade-06/lessons/15-Length.md
